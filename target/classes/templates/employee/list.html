<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Employees</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h4 class="fw-bold mb-0">Employees</h4>
            <a th:href="@{/employees/add}" class="btn btn-primary rounded-pill px-4 hover-lift">
                <i class="bi bi-person-plus-fill me-2"></i>Add Employee
            </a>
        </div>

        <!-- Filter Card -->
        <div class="glass-card p-4 rounded-4 shadow-sm mb-4">
            <form th:action="@{/employees}" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold small text-muted">Search</label>
                    <input type="text" name="search" class="form-control" th:value="${filter.search}" placeholder="Name or Code...">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold small text-muted">Department</label>
                    <select name="departmentId" class="form-select">
                        <option value="">All</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}" th:selected="${filter.departmentId == dept.id}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold small text-muted">Status</label>
                    <select name="status" class="form-select">
                        <option value="">All</option>
                        <option value="ACTIVE" th:selected="${filter.status != null and filter.status.name() == 'ACTIVE'}">Active</option>
                        <option value="INACTIVE" th:selected="${filter.status != null and filter.status.name() == 'INACTIVE'}">Inactive</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold small text-muted">Type</label>
                    <select name="employmentType" class="form-select">
                        <option value="">All</option>
                        <option value="FULL_TIME" th:selected="${filter.employmentType != null and filter.employmentType.name() == 'FULL_TIME'}">Full Time</option>
                        <option value="PART_TIME" th:selected="${filter.employmentType != null and filter.employmentType.name() == 'PART_TIME'}">Part Time</option>
                        <option value="CONTRACT" th:selected="${filter.employmentType != null and filter.employmentType.name() == 'CONTRACT'}">Contract</option>
                        <option value="INTERN" th:selected="${filter.employmentType != null and filter.employmentType.name() == 'INTERN'}">Intern</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Filter</button>
                    <a th:href="@{/employees}" class="btn btn-light w-100">Clear</a>
                </div>
            </form>
        </div>

        <!-- Employee List -->
        <div class="glass-card p-4 rounded-4 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Employee</th>
                            <th>Employee ID</th>
                            <th>Department & Role</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${employeePage.empty}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-people fs-1 d-block mb-2"></i>
                                No employees found.
                            </td>
                        </tr>
                        <tr th:each="emp : ${employeePage.content}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:if="${emp.photoPath != null}" th:src="@{${emp.photoPath}}" class="rounded-circle me-3" width="45" height="45" style="object-fit: cover;">
                                    <img th:if="${emp.photoPath == null}" th:src="@{'https://ui-avatars.com/api/?name=' + ${emp.firstName} + '+' + ${emp.lastName} + '&background=random'}" class="rounded-circle me-3" width="45" height="45">
                                    <div>
                                        <h6 class="mb-0 fw-bold" th:text="${emp.fullName}">Name</h6>
                                        <small class="text-muted" th:text="${emp.email}">email</small>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${emp.employeeCode}">EMP-001</td>
                            <td>
                                <div th:text="${emp.department != null ? emp.department.name : '-'}">Dept</div>
                                <small class="text-muted" th:text="${emp.designation != null ? emp.designation.name : '-'}">Desig</small>
                            </td>
                            <td th:text="${emp.employmentType}">FULL_TIME</td>
                            <td>
                                <span class="badge rounded-pill px-3" 
                                      th:classappend="${emp.status.name() == 'ACTIVE' ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'}" 
                                      th:text="${emp.status}">Active</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/employees/view/{id}(id=${emp.id})}" class="btn btn-sm btn-light btn-icon rounded-circle me-1" title="View">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-light btn-icon rounded-circle me-1" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <div class="dropdown d-inline">
                                    <button class="btn btn-sm btn-light btn-icon rounded-circle" type="button" data-bs-toggle="dropdown">
                                        <i class="bi bi-three-dots-vertical"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                                        <li>
                                            <form th:action="@{/employees/toggle-status/{id}(id=${emp.id})}" method="post">
                                                <button type="submit" class="dropdown-item">
                                                    <i class="bi me-2" th:classappend="${emp.status.name() == 'ACTIVE' ? 'bi-person-dash text-warning' : 'bi-person-check text-success'}"></i>
                                                    <span th:text="${emp.status.name() == 'ACTIVE' ? 'Deactivate' : 'Activate'}"></span>
                                                </button>
                                            </form>
                                        </li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li>
                                            <form th:action="@{/employees/delete/{id}(id=${emp.id})}" method="post" onsubmit="return confirm('Are you sure you want to completely delete this employee?');">
                                                <button type="submit" class="dropdown-item text-danger">
                                                    <i class="bi bi-trash me-2"></i>Delete
                                                </button>
                                            </form>
                                        </li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-4" th:if="${employeePage.totalPages > 1}">
                <span class="text-muted small">Showing <span th:text="${employeePage.number * employeePage.size + 1}"></span> to <span th:text="${employeePage.number * employeePage.size + employeePage.numberOfElements}"></span> of <span th:text="${employeePage.totalElements}"></span> entries</span>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${employeePage.first} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/employees(page=${employeePage.number - 1}, search=${filter.search}, departmentId=${filter.departmentId}, status=${filter.status}, employmentType=${filter.employmentType})}">Previous</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, employeePage.totalPages - 1)}" th:classappend="${employeePage.number == i} ? 'active' : ''">
                            <a class="page-link" th:href="@{/employees(page=${i}, search=${filter.search}, departmentId=${filter.departmentId}, status=${filter.status}, employmentType=${filter.employmentType})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${employeePage.last} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/employees(page=${employeePage.number + 1}, search=${filter.search}, departmentId=${filter.departmentId}, status=${filter.status}, employmentType=${filter.employmentType})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
