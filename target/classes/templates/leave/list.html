<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Leave Requests</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h4 class="fw-bold mb-0">Leave Requests</h4>
            <div class="d-flex gap-2">
                <a th:href="@{/leaves/calendar}" class="btn btn-light rounded-pill px-4">
                    <i class="bi bi-calendar3 me-2"></i>Calendar View
                </a>
                <a th:href="@{/leaves/add}" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-plus-lg me-2"></i>Apply Leave
                </a>
            </div>
        </div>

        <!-- Filter Card -->
        <div class="glass-card p-4 rounded-4 shadow-sm mb-4">
            <form th:action="@{/leaves}" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold small text-muted">Search Employee</label>
                    <input type="text" name="search" class="form-control" th:value="${filter.search}" placeholder="Name...">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold small text-muted">Leave Type</label>
                    <select name="leaveTypeId" class="form-select">
                        <option value="">All Types</option>
                        <option th:each="lt : ${leaveTypes}" th:value="${lt.id}" th:text="${lt.name}" th:selected="${filter.leaveTypeId == lt.id}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold small text-muted">Status</label>
                    <select name="status" class="form-select">
                        <option value="">All Statuses</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${filter.status == st}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold small text-muted">From Date</label>
                    <input type="date" name="fromDate" class="form-control" th:value="${filter.fromDate}">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Filter</button>
                    <a th:href="@{/leaves}" class="btn btn-light w-100">Clear</a>
                </div>
            </form>
        </div>

        <!-- Tabs for quick status filtering (using the same URL with params) -->
        <ul class="nav nav-tabs border-0 mb-4" role="tablist">
            <li class="nav-item">
                <a class="nav-link rounded-pill px-4 fw-bold me-2 border-0" th:classappend="${filter.status == null} ? 'active bg-white text-primary shadow-sm' : 'bg-light text-muted'" th:href="@{/leaves(departmentId=${filter.departmentId}, leaveTypeId=${filter.leaveTypeId})}">All Requests</a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-4 fw-bold me-2 border-0" th:classappend="${filter.status != null and filter.status.name() == 'PENDING'} ? 'active bg-white text-warning shadow-sm' : 'bg-light text-muted'" th:href="@{/leaves(status='PENDING')}">Pending</a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-4 fw-bold me-2 border-0" th:classappend="${filter.status != null and filter.status.name() == 'APPROVED'} ? 'active bg-white text-success shadow-sm' : 'bg-light text-muted'" th:href="@{/leaves(status='APPROVED')}">Approved</a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill px-4 fw-bold border-0" th:classappend="${filter.status != null and filter.status.name() == 'REJECTED'} ? 'active bg-white text-danger shadow-sm' : 'bg-light text-muted'" th:href="@{/leaves(status='REJECTED')}">Rejected</a>
            </li>
        </ul>

        <div class="glass-card p-4 rounded-4 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Employee</th>
                            <th>Leave Type</th>
                            <th>Duration</th>
                            <th>Total Days</th>
                            <th>Status</th>
                            <th>Applied On</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${leavePage.empty}">
                            <td colspan="7" class="text-center py-5 text-muted">No leave requests found.</td>
                        </tr>
                        <tr th:each="lr : ${leavePage.content}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:if="${lr.employee.photoPath != null}" th:src="@{${lr.employee.photoPath}}" class="rounded-circle me-2" width="35" height="35" style="object-fit: cover;">
                                    <img th:if="${lr.employee.photoPath == null}" th:src="@{'https://ui-avatars.com/api/?name=' + ${lr.employee.firstName} + '+' + ${lr.employee.lastName} + '&background=random'}" class="rounded-circle me-2" width="35" height="35">
                                    <div>
                                        <h6 class="mb-0 fw-bold" th:text="${lr.employee.fullName}">Name</h6>
                                        <small class="text-muted" th:text="${lr.employee.employeeCode}">EMP</small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge" th:style="'background-color: ' + ${lr.leaveType.color} + '20; color: ' + ${lr.leaveType.color}" th:text="${lr.leaveType.name}">Sick</span>
                                <small class="d-block text-muted" th:if="${lr.halfDay}">Half Day</small>
                            </td>
                            <td>
                                <div class="fw-bold" th:text="${#temporals.format(lr.fromDate, 'dd MMM yyyy')}">01 Jan</div>
                                <small class="text-muted">to <span th:text="${#temporals.format(lr.toDate, 'dd MMM yyyy')}"></span></small>
                            </td>
                            <td class="fw-bold" th:text="${lr.totalDays}">1.0</td>
                            <td>
                                <span class="badge rounded-pill px-3" 
                                      th:classappend="${lr.status.name() == 'PENDING' ? 'bg-warning text-dark' : lr.status.name() == 'APPROVED' ? 'bg-success' : 'bg-danger'}" 
                                      th:text="${lr.status}">Status</span>
                            </td>
                            <td class="text-muted small" th:text="${#temporals.format(lr.createdAt, 'dd MMM, HH:mm')}">Date</td>
                            <td class="text-end">
                                <button th:if="${lr.status.name() == 'PENDING'}" class="btn btn-sm btn-primary rounded-pill px-3" 
                                        th:onclick="'openReviewModal(' + ${lr.id} + ', \'' + ${lr.employee.fullName} + '\', \'' + ${lr.leaveType.name} + '\')'">
                                    Review
                                </button>
                                <button th:if="${lr.status.name() != 'PENDING'}" class="btn btn-sm btn-light rounded-pill px-3 text-muted"
                                        th:onclick="'alert(\'Reviewed by HR. Comment: ' + ${lr.reviewComment != null ? lr.reviewComment : 'None'} + '\')'">
                                    Details
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="mt-4" th:if="${leavePage.totalPages > 1}">
                <nav>
                    <ul class="pagination pagination-sm mb-0 justify-content-end">
                        <li class="page-item" th:classappend="${leavePage.first} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/leaves(page=${leavePage.number - 1}, search=${filter.search}, leaveTypeId=${filter.leaveTypeId}, status=${filter.status})}">Prev</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, leavePage.totalPages - 1)}" th:classappend="${leavePage.number == i} ? 'active' : ''">
                            <a class="page-link" th:href="@{/leaves(page=${i}, search=${filter.search}, leaveTypeId=${filter.leaveTypeId}, status=${filter.status})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${leavePage.last} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/leaves(page=${leavePage.number + 1}, search=${filter.search}, leaveTypeId=${filter.leaveTypeId}, status=${filter.status})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- Review Modal -->
        <div class="modal fade" id="reviewModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content rounded-4 border-0 shadow">
                    <form th:action="@{/leaves/action}" method="post">
                        <div class="modal-header border-bottom-0 pb-0">
                            <h5 class="modal-title fw-bold">Review Leave</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" name="leaveRequestId" id="modalReqId">
                            <p class="mb-3">Reviewing <strong id="modalLeaveType" class="text-primary"></strong> for <strong id="modalEmpName"></strong>.</p>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Action <span class="text-danger">*</span></label>
                                <select name="action" class="form-select" required>
                                    <option value="">Select Action</option>
                                    <option value="APPROVE">Approve</option>
                                    <option value="REJECT">Reject</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Review Comment</label>
                                <textarea name="reviewComment" class="form-control" rows="3" placeholder="Optional comment..."></textarea>
                            </div>
                        </div>
                        <div class="modal-footer border-top-0 pt-0">
                            <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Submit Decision</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <th:block layout:fragment="scripts">
            <script>
                function openReviewModal(id, empName, leaveType) {
                    document.getElementById('modalReqId').value = id;
                    document.getElementById('modalEmpName').innerText = empName;
                    document.getElementById('modalLeaveType').innerText = leaveType;
                    new bootstrap.Modal(document.getElementById('reviewModal')).show();
                }
            </script>
        </th:block>
    </div>
</body>
</html>
