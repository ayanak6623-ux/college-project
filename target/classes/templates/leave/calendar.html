<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Leave Calendar</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">
                <a th:href="@{/leaves}" class="btn btn-light rounded-circle me-3"><i class="bi bi-arrow-left"></i></a>
                <h4 class="fw-bold mb-0">Leave Calendar</h4>
            </div>
        </div>

        <div class="glass-card p-4 rounded-4 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <button class="btn btn-light rounded-circle" id="prevMonth"><i class="bi bi-chevron-left"></i></button>
                <h5 class="fw-bold mb-0" id="monthYear">Month Year</h5>
                <button class="btn btn-light rounded-circle" id="nextMonth"><i class="bi bi-chevron-right"></i></button>
            </div>
            
            <div class="row text-center fw-bold text-muted g-0 mb-2 border-bottom pb-2">
                <div class="col">Su</div><div class="col">Mo</div><div class="col">Tu</div>
                <div class="col">We</div><div class="col">Th</div><div class="col">Fr</div><div class="col">Sa</div>
            </div>
            
            <!-- Calendar Grid -->
            <div id="calendarGrid" class="row g-0"></div>
        </div>
        
        <script th:inline="javascript">
            // Approved leaves passed from controller
            const approvedLeaves = /*[[${approvedLeaves}]]*/ [];
            
            let currDate = new Date();
            
            function renderCalendar() {
                const month = currDate.getMonth();
                const year = currDate.getFullYear();
                
                const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                document.getElementById('monthYear').innerText = months[month] + " " + year;
                
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                let html = '';
                // Empty slots
                for(let i=0; i<firstDay; i++) {
                    html += '<div class="col border-end border-bottom p-1" style="min-height:100px; background: rgba(0,0,0,0.02)"></div>';
                }
                
                // Days
                for(let i=1; i<=daysInMonth; i++) {
                    let y = year;
                    let m = String(month+1).padStart(2, '0');
                    let d = String(i).padStart(2, '0');
                    let dateStr = `${y}-${m}-${d}`;
                    
                    // Find leaves spanning this date
                    let dayLeavesHtml = '';
                    approvedLeaves.forEach(lr => {
                        if (dateStr >= lr.fromDate && dateStr <= lr.toDate) {
                            dayLeavesHtml += `
                                <div class="badge w-100 text-start text-truncate mb-1 p-2 shadow-sm" style="background-color: ${lr.leaveType.color};" title="${lr.employee.firstName} ${lr.employee.lastName} - ${lr.leaveType.name}" data-bs-toggle="tooltip">
                                    <small>${lr.employee.firstName} ${lr.employee.lastName.substring(0,1)}.</small>
                                </div>
                            `;
                        }
                    });
                    
                    let isToday = (dateStr === new Date().toISOString().split('T')[0]);
                    let todayBadge = isToday ? '<span class="badge bg-primary rounded-circle p-2">Today</span>' : `<span class="text-muted fw-bold">${i}</span>`;
                    
                    html += `
                        <div class="col border-end border-bottom p-2 d-flex flex-column" style="min-height:120px;">
                            <div class="text-end mb-2">${todayBadge}</div>
                            <div class="flex-grow-1 overflow-auto" style="max-height: 80px;">
                                ${dayLeavesHtml}
                            </div>
                        </div>
                    `;
                    
                    if ((i + firstDay) % 7 === 0) {
                        html += '<div class="w-100"></div>';
                    }
                }
                
                // Fill remaining slots
                const totalCells = firstDay + daysInMonth;
                const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
                for(let i=0; i<remaining; i++) {
                    html += '<div class="col border-end border-bottom p-1" style="min-height:120px; background: rgba(0,0,0,0.02)"></div>';
                }
                
                document.getElementById('calendarGrid').innerHTML = html;
                
                var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
                tooltipTriggerList.map(function (tooltipTriggerEl) {
                  return new bootstrap.Tooltip(tooltipTriggerEl)
                });
            }
            
            document.getElementById('prevMonth').addEventListener('click', () => { currDate.setMonth(currDate.getMonth() - 1); renderCalendar(); });
            document.getElementById('nextMonth').addEventListener('click', () => { currDate.setMonth(currDate.getMonth() + 1); renderCalendar(); });
            
            document.addEventListener('DOMContentLoaded', renderCalendar);
        </script>
    </div>
</body>
</html>
