<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="top-navbar px-4 py-3 d-flex justify-content-between align-items-center shadow-sm">
    <div class="d-flex align-items-center">
        <button class="btn btn-light d-lg-none me-3" id="sidebar-toggle">
            <i class="bi bi-list fs-4"></i>
        </button>
        <div class="input-group d-none d-md-flex" style="width: 300px;">
            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-start-0" placeholder="Search...">
        </div>
    </div>
    
    <div class="d-flex align-items-center gap-3">
        <button id="theme-toggle" class="btn btn-light rounded-circle p-2 lh-1">
            <i class="bi bi-moon"></i>
        </button>
        
        <div class="position-relative">
            <a th:href="@{/leaves(status='PENDING')}" class="btn btn-light rounded-circle p-2 lh-1 text-dark">
                <i class="bi bi-bell"></i>
            </a>
            <span th:if="${globalPendingLeavesCount != null and globalPendingLeavesCount > 0}" th:text="${globalPendingLeavesCount}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light" style="font-size: 0.65rem;">
                3
            </span>
        </div>
        
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-main" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="https://ui-avatars.com/api/?name=HR+Admin&background=4F46E5&color=fff" alt="" width="32" height="32" class="rounded-circle me-2">
                <strong sec:authentication="name">HR Admin</strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="dropdownUser1">
                <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-person me-2"></i>Profile</a></li>
                <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-gear me-2"></i>Settings</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Sign out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
