<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title th:text="${shiftDto.id == null ? 'Add Shift' : 'Edit Shift'}">Shift Form</title>
</head>
<body>
    <div layout:fragment="content" class="max-w-md mx-auto" style="max-width: 700px;">
        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/attendance-config(tab='shifts')}" class="btn btn-light rounded-circle me-3"><i class="bi bi-arrow-left"></i></a>
            <h4 class="fw-bold mb-0" th:text="${shiftDto.id == null ? 'Add Shift' : 'Edit Shift'}">Form</h4>
        </div>

        <div class="glass-card p-4 rounded-4 shadow-sm">
            <form th:action="@{/attendance-config/shift/save}" th:object="${shiftDto}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:field="*{id}">
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Shift Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Color Code</label>
                        <input type="color" class="form-control form-control-color w-100" th:field="*{color}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Start Time <span class="text-danger">*</span></label>
                        <input type="time" class="form-control" th:field="*{startTime}" th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid' : ''" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-bold">End Time <span class="text-danger">*</span></label>
                        <input type="time" class="form-control" th:field="*{endTime}" th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid' : ''" required>
                        <small class="text-muted">If End < Start, it's treated as overnight.</small>
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Break (Mins)</label>
                        <input type="number" class="form-control" th:field="*{breakMinutes}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Grace (Mins)</label>
                        <input type="number" class="form-control" th:field="*{graceMinutes}">
                    </div>
                    
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Half Day Hours</label>
                        <input type="number" step="0.5" class="form-control" th:field="*{halfDayHours}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Full Day Hours</label>
                        <input type="number" step="0.5" class="form-control" th:field="*{fullDayHours}">
                    </div>
                    
                    <div class="col-12 mt-4">
                        <label class="form-label fw-bold">Working Days</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check form-check-inline" th:each="day : ${ {'MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'} }">
                                <input class="form-check-input" type="checkbox" th:field="*{workingDaysList}" th:value="${day}">
                                <label class="form-check-label" th:text="${day.substring(0,3)}">MON</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/attendance-config(tab='shifts')}" class="btn btn-light rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">Save Shift</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
