<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title th:text="${leaveTypeDto.id == null ? 'Add Leave Type' : 'Edit Leave Type'}">Leave Type Form</title>
</head>
<body>
    <div layout:fragment="content" class="max-w-md mx-auto" style="max-width: 700px;">
        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/leave-types}" class="btn btn-light rounded-circle me-3"><i class="bi bi-arrow-left"></i></a>
            <h4 class="fw-bold mb-0" th:text="${leaveTypeDto.id == null ? 'New Leave Type' : 'Edit Leave Type'}">Form</h4>
        </div>

        <div class="glass-card p-4 rounded-4 shadow-sm">
            <form th:action="@{/leave-types/save}" th:object="${leaveTypeDto}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:field="*{id}">
                
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{code}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Color</label>
                        <input type="color" class="form-control form-control-color w-100" th:field="*{color}">
                    </div>
                    
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Yearly Quota (Days) <span class="text-danger">*</span></label>
                        <input type="number" step="0.5" class="form-control" th:field="*{yearlyQuota}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Applicable Gender</label>
                        <select class="form-select" th:field="*{applicableGender}">
                            <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Max Carry Fwd</label>
                        <input type="number" class="form-control" th:field="*{maxCarryDays}" id="maxCarryDays">
                    </div>
                    
                    <div class="col-12 mt-4">
                        <div class="d-flex flex-wrap gap-4 p-3 bg-light rounded-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{paid}" id="isPaid">
                                <label class="form-check-label fw-bold" for="isPaid">Paid Leave</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{carryForward}" id="isCarry" onchange="document.getElementById('maxCarryDays').disabled = !this.checked;">
                                <label class="form-check-label fw-bold" for="isCarry">Carry Forward</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{requiresApproval}" id="reqApproval">
                                <label class="form-check-label fw-bold" for="reqApproval">Requires Approval</label>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{active}" id="isActive">
                                <label class="form-check-label fw-bold text-success" for="isActive">Active Status</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label fw-bold">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="2"></textarea>
                    </div>
                </div>
                
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/leave-types}" class="btn btn-light rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">Save Leave Type</button>
                </div>
            </form>
        </div>
    </div>
    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                document.getElementById('maxCarryDays').disabled = !document.getElementById('isCarry').checked;
            });
        </script>
    </th:block>
</body>
</html>
