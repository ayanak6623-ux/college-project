<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Leave Types</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">Leave Types</h4>
            <a th:href="@{/leave-types/add}" class="btn btn-primary rounded-pill px-4">
                <i class="bi bi-plus-lg me-2"></i>New Leave Type
            </a>
        </div>

        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="lt : ${leaveTypes}">
                <div class="glass-card rounded-4 p-4 h-100 position-relative hover-lift border-top border-4 shadow-sm" th:style="'border-color: ' + ${lt.color} + ' !important;'">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <span class="badge rounded-pill mb-2" th:classappend="${lt.active} ? 'bg-success' : 'bg-secondary'" th:text="${lt.active ? 'Active' : 'Inactive'}">Active</span>
                            <span class="badge rounded-pill mb-2 ms-1" th:classappend="${lt.paid} ? 'bg-primary' : 'bg-warning text-dark'" th:text="${lt.paid ? 'Paid' : 'Unpaid'}">Paid</span>
                            <h5 class="fw-bold mb-0" th:text="${lt.name}">Vacation</h5>
                            <small class="text-muted fw-bold" th:text="${lt.code}">VAC</small>
                        </div>
                        <a th:href="@{/leave-types/edit/{id}(id=${lt.id})}" class="btn btn-sm btn-light btn-icon rounded-circle"><i class="bi bi-pencil"></i></a>
                    </div>
                    
                    <h2 class="fw-bold mb-3"><span th:text="${lt.yearlyQuota}">12</span> <small class="fs-6 text-muted fw-normal">days / year</small></h2>
                    
                    <p class="text-muted small mb-3" th:text="${lt.description}">Description</p>
                    
                    <div class="d-flex flex-wrap gap-2 small">
                        <span class="bg-light px-2 py-1 rounded" th:if="${lt.carryForward}"><i class="bi bi-box-arrow-in-right text-muted me-1"></i>Carry: <span th:text="${lt.maxCarryDays}"></span>d</span>
                        <span class="bg-light px-2 py-1 rounded" th:if="${!lt.carryForward}"><i class="bi bi-x-circle text-muted me-1"></i>No Carry Fwd</span>
                        
                        <span class="bg-light px-2 py-1 rounded" th:if="${lt.requiresApproval}"><i class="bi bi-check2-square text-muted me-1"></i>Needs Approval</span>
                        <span class="bg-light px-2 py-1 rounded" th:if="${!lt.requiresApproval}"><i class="bi bi-lightning text-muted me-1"></i>Auto Approve</span>
                        
                        <span class="bg-light px-2 py-1 rounded" th:if="${lt.applicableGender.name() != 'ALL'}"><i class="bi bi-gender-ambiguous text-muted me-1"></i><span th:text="${lt.applicableGender}"></span> Only</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
