<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav id="sidebar" th:fragment="sidebar" class="d-flex flex-column p-3 vh-100">
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none text-main">
        <i class="bi bi-buildings-fill fs-3 text-gradient me-2"></i>
        <span class="fs-4 fw-bold">PeopleHub</span>
    </a>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-1">
            <a th:href="@{/dashboard}" class="nav-link text-main p-3" th:classappend="${#request.requestURI == '/dashboard' ? 'active' : ''}">
                <i class="bi bi-grid-1x2-fill me-2"></i>
                Dashboard
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/employees}" class="nav-link text-main p-3" th:classappend="${#request.requestURI.startsWith('/employees') ? 'active' : ''}">
                <i class="bi bi-people-fill me-2"></i>
                Employees
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/departments}" class="nav-link text-main p-3" th:classappend="${#request.requestURI.startsWith('/departments') ? 'active' : ''}">
                <i class="bi bi-diagram-3-fill me-2"></i>
                Departments
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/designations}" class="nav-link text-main p-3" th:classappend="${#request.requestURI.startsWith('/designations') ? 'active' : ''}">
                <i class="bi bi-person-vcard-fill me-2"></i>
                Designations
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/attendance/daily}" class="nav-link text-main p-3" th:classappend="${#request.requestURI.startsWith('/attendance/daily')} ? 'active' : ''">
                <i class="bi bi-calendar-check-fill me-2"></i>
                Attendance
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/attendance-config}" class="nav-link text-main p-3" th:classappend="${#request.requestURI.startsWith('/attendance-config')} ? 'active' : ''">
                <i class="bi bi-gear-wide-connected me-2"></i>
                Att. Config
            </a>
        </li>
        <li class="nav-item mb-1">
            <a class="nav-link text-main p-3" data-bs-toggle="collapse" href="#leaveMenu" role="button" aria-expanded="false" aria-controls="leaveMenu" th:classappend="${#request.requestURI.startsWith('/leave')} ? 'active' : ''">
                <i class="bi bi-envelope-paper-fill me-2"></i>
                Leave Mgmt <i class="bi bi-chevron-down ms-2 small"></i>
            </a>
            <div class="collapse" id="leaveMenu" th:classappend="${#request.requestURI.startsWith('/leave')} ? 'show' : ''">
                <ul class="nav flex-column ms-3 mt-1">
                    <li class="nav-item">
                        <a th:href="@{/leaves}" class="nav-link text-main py-2" th:classappend="${#request.requestURI == '/leaves'} ? 'text-primary fw-bold' : ''">Requests</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/leave-types}" class="nav-link text-main py-2" th:classappend="${#request.requestURI == '/leave-types'} ? 'text-primary fw-bold' : ''">Leave Types</a>
                    </li>
                </ul>
            </div>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/settings}" class="nav-link text-main p-3" th:classappend="${#request.requestURI.startsWith('/settings')} ? 'active' : ''">
                <i class="bi bi-gear-fill me-2"></i>
                Settings
            </a>
        </li>
    </ul>
</nav>
</body>
</html>
