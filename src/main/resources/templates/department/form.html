<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title th:text="${departmentDto.id == null ? 'Add Department' : 'Edit Department'}">Department Form</title>
</head>
<body>
    <div layout:fragment="content" class="max-w-md mx-auto" style="max-width: 600px;">
        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/departments}" class="btn btn-light rounded-circle me-3"><i class="bi bi-arrow-left"></i></a>
            <h4 class="fw-bold mb-0" th:text="${departmentDto.id == null ? 'Add Department' : 'Edit Department'}">Form</h4>
        </div>

        <div class="glass-card p-4 rounded-4 shadow-sm">
            <form th:action="@{/departments/save}" th:object="${departmentDto}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Department Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Description</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                </div>
                
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/departments}" class="btn btn-light rounded-pill px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">Save Department</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
