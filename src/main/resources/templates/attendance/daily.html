<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Daily Attendance</title>
</head>
<body>
    <div layout:fragment="content">
        <h4 class="fw-bold mb-4">Daily Attendance</h4>

        <!-- Summary Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="glass-card rounded-4 p-4 h-100 border-start border-4 border-success">
                    <h6 class="text-muted mb-2">Present</h6>
                    <h2 class="fw-bold mb-0 text-success" th:text="${presentCount}">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card rounded-4 p-4 h-100 border-start border-4 border-danger">
                    <h6 class="text-muted mb-2">Absent</h6>
                    <h2 class="fw-bold mb-0 text-danger" th:text="${absentCount}">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card rounded-4 p-4 h-100 border-start border-4 border-warning">
                    <h6 class="text-muted mb-2">Late</h6>
                    <h2 class="fw-bold mb-0 text-warning" th:text="${lateCount}">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card rounded-4 p-4 h-100 border-start border-4 border-info">
                    <h6 class="text-muted mb-2">On Leave</h6>
                    <h2 class="fw-bold mb-0 text-info" th:text="${leaveCount}">0</h2>
                </div>
            </div>
        </div>

        <!-- Filter Card -->
        <div class="glass-card p-4 rounded-4 shadow-sm mb-4">
            <form th:action="@{/attendance/daily}" method="get" class="row g-3 align-items-end">
                <div class="col-md-2">
                    <label class="form-label fw-bold small text-muted">Date</label>
                    <input type="date" name="date" class="form-control" th:value="${filter.date}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold small text-muted">Search Employee</label>
                    <input type="text" name="search" class="form-control" th:value="${filter.search}" placeholder="Name...">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold small text-muted">Department</label>
                    <select name="departmentId" class="form-select">
                        <option value="">All</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}" th:selected="${filter.departmentId == dept.id}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold small text-muted">Status</label>
                    <select name="status" class="form-select">
                        <option value="">All</option>
                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${filter.status == st}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Filter</button>
                    <a th:href="@{/attendance/daily}" class="btn btn-light w-100">Clear</a>
                </div>
            </form>
        </div>

        <!-- Attendance List -->
        <div class="glass-card p-4 rounded-4 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Employee</th>
                            <th>Shift</th>
                            <th>Check In</th>
                            <th>Check Out</th>
                            <th>Hours</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${attendancePage.empty}">
                            <td colspan="7" class="text-center py-5 text-muted">No attendance records found for this date.</td>
                        </tr>
                        <tr th:each="att : ${attendancePage.content}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:if="${att.employee.photoPath != null}" th:src="@{${att.employee.photoPath}}" class="rounded-circle me-2" width="35" height="35" style="object-fit: cover;">
                                    <img th:if="${att.employee.photoPath == null}" th:src="@{'https://ui-avatars.com/api/?name=' + ${att.employee.firstName} + '+' + ${att.employee.lastName} + '&background=random'}" class="rounded-circle me-2" width="35" height="35">
                                    <div>
                                        <h6 class="mb-0 fw-bold" th:text="${att.employee.fullName}">Name</h6>
                                        <small class="text-muted" th:text="${att.employee.employeeCode}">EMP-001</small>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${att.employee.shift != null ? att.employee.shift.name : '-'}">Shift</td>
                            <td th:text="${att.checkIn != null ? #temporals.format(att.checkIn, 'HH:mm') : '-'}">09:00</td>
                            <td th:text="${att.checkOut != null ? #temporals.format(att.checkOut, 'HH:mm') : '-'}">17:00</td>
                            <td th:text="${att.totalHours != null ? #numbers.formatDecimal(att.totalHours, 1, 1) + 'h' : '-'}">8.0h</td>
                            <td>
                                <span class="badge rounded-pill px-3" 
                                      th:classappend="${att.status.name() == 'PRESENT' ? 'bg-success' : 
                                                       att.status.name() == 'ABSENT' ? 'bg-danger' : 
                                                       att.status.name() == 'LATE' ? 'bg-warning' : 'bg-info'}" 
                                      th:text="${att.status}">Status</span>
                            </td>
                            <td class="text-end">
                                <!-- Manual Add/Edit modal trigger -->
                                <button class="btn btn-sm btn-light btn-icon rounded-circle" th:onclick="'openEditModal(' + ${att.employee.id} + ', \'' + ${att.employee.fullName} + '\', \'' + ${att.checkIn} + '\', \'' + ${att.checkOut} + '\', \'' + ${att.status} + '\', \'' + ${att.remarks} + '\')'">
                                    <i class="bi bi-pencil"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="mt-4" th:if="${attendancePage.totalPages > 1}">
                <nav>
                    <ul class="pagination pagination-sm mb-0 justify-content-end">
                        <li class="page-item" th:classappend="${attendancePage.first} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/attendance/daily(page=${attendancePage.number - 1}, date=${filter.date}, search=${filter.search}, departmentId=${filter.departmentId}, status=${filter.status})}">Prev</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, attendancePage.totalPages - 1)}" th:classappend="${attendancePage.number == i} ? 'active' : ''">
                            <a class="page-link" th:href="@{/attendance/daily(page=${i}, date=${filter.date}, search=${filter.search}, departmentId=${filter.departmentId}, status=${filter.status})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${attendancePage.last} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/attendance/daily(page=${attendancePage.number + 1}, date=${filter.date}, search=${filter.search}, departmentId=${filter.departmentId}, status=${filter.status})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- Edit Modal -->
        <div class="modal fade" id="editModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content rounded-4 border-0 shadow">
                    <form th:action="@{/attendance/save}" method="post">
                        <div class="modal-header border-bottom-0 pb-0">
                            <h5 class="modal-title fw-bold">Edit Attendance: <span id="modalEmpName" class="text-primary"></span></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" name="employeeId" id="modalEmpId">
                            <input type="hidden" name="date" th:value="${filter.date}">
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Check In</label>
                                    <input type="time" name="checkIn" id="modalCheckIn" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Check Out</label>
                                    <input type="time" name="checkOut" id="modalCheckOut" class="form-control">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small">Status</label>
                                    <select name="status" id="modalStatus" class="form-select" required>
                                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small">Remarks</label>
                                    <textarea name="remarks" id="modalRemarks" class="form-control" rows="2"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer border-top-0 pt-0">
                            <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <th:block layout:fragment="scripts">
            <script>
                function openEditModal(empId, empName, checkIn, checkOut, status, remarks) {
                    document.getElementById('modalEmpId').value = empId;
                    document.getElementById('modalEmpName').innerText = empName;
                    document.getElementById('modalCheckIn').value = (checkIn !== 'null' && checkIn !== '') ? checkIn.substring(0,5) : '';
                    document.getElementById('modalCheckOut').value = (checkOut !== 'null' && checkOut !== '') ? checkOut.substring(0,5) : '';
                    document.getElementById('modalStatus').value = status;
                    document.getElementById('modalRemarks').value = remarks !== 'null' ? remarks : '';
                    
                    new bootstrap.Modal(document.getElementById('editModal')).show();
                }
            </script>
        </th:block>
    </div>
</body>
</html>
