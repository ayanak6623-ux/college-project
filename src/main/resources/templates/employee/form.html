<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title th:text="${employeeDto.id == null ? 'Add Employee' : 'Edit Employee'}">Employee Form</title>
    <style>
        .nav-pills .nav-link { border-radius: 50rem; color: var(--text-muted); font-weight: 500; }
        .nav-pills .nav-link.active { background-color: var(--primary-color); color: #fff; }
        .step-pane { display: none; }
        .step-pane.active { display: block; animation: fadeIn 0.4s ease-in; }
    </style>
</head>
<body>
    <div layout:fragment="content" class="max-w-4xl mx-auto">
        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/employees}" class="btn btn-light rounded-circle me-3"><i class="bi bi-arrow-left"></i></a>
            <h4 class="fw-bold mb-0" th:text="${employeeDto.id == null ? 'Add New Employee' : 'Edit Employee'}">Form</h4>
        </div>

        <div class="glass-card p-4 rounded-4 shadow-sm">
            
            <!-- Stepper Header -->
            <ul class="nav nav-pills nav-justified mb-5 gap-2 flex-column flex-md-row" id="stepper">
                <li class="nav-item">
                    <button class="nav-link active w-100" id="btn-step1" type="button" onclick="showStep(1)">
                        <i class="bi bi-person-badge me-2"></i>Personal Info
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link w-100" id="btn-step2" type="button" onclick="showStep(2)">
                        <i class="bi bi-briefcase me-2"></i>Job Info
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link w-100" id="btn-step3" type="button" onclick="showStep(3)">
                        <i class="bi bi-check2-circle me-2"></i>Shift & Review
                    </button>
                </li>
            </ul>

            <form th:action="@{/employees/save}" th:object="${employeeDto}" method="post" enctype="multipart/form-data" class="needs-validation" id="employeeForm" novalidate>
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{existingPhotoPath}">
                
                <!-- STEP 1 -->
                <div class="step-pane active" id="step1">
                    <h5 class="fw-bold mb-4">Personal Information</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{firstName}" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{lastName}" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Phone <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{phone}" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Date of Birth <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" th:field="*{dateOfBirth}" th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Gender <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{gender}" th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid' : ''" required>
                                <option value="">Select Gender</option>
                                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Address</label>
                            <textarea class="form-control" th:field="*{address}" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Photo</label>
                            <input type="file" class="form-control" th:field="*{photoFile}" accept="image/png, image/jpeg">
                            <small class="text-muted" th:if="${employeeDto.existingPhotoPath != null}">Current photo exists. Uploading a new one will replace it.</small>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end mt-4">
                        <button type="button" class="btn btn-primary rounded-pill px-4" onclick="showStep(2)">Next Step <i class="bi bi-arrow-right ms-2"></i></button>
                    </div>
                </div>
                
                <!-- STEP 2 -->
                <div class="step-pane" id="step2">
                    <h5 class="fw-bold mb-4">Job Information</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Department <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{departmentId}" th:classappend="${#fields.hasErrors('departmentId')} ? 'is-invalid' : ''" required>
                                <option value="">Select Department</option>
                                <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Designation <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{designationId}" th:classappend="${#fields.hasErrors('designationId')} ? 'is-invalid' : ''" required>
                                <option value="">Select Designation</option>
                                <option th:each="d : ${designations}" th:value="${d.id}" th:text="${d.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('designationId')}" th:errors="*{designationId}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Employment Type <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{employmentType}" th:classappend="${#fields.hasErrors('employmentType')} ? 'is-invalid' : ''" required>
                                <option value="">Select Type</option>
                                <option th:each="e : ${employmentTypes}" th:value="${e}" th:text="${e}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('employmentType')}" th:errors="*{employmentType}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Joining Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" th:field="*{joiningDate}" th:classappend="${#fields.hasErrors('joiningDate')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('joiningDate')}" th:errors="*{joiningDate}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Reporting Manager</label>
                            <select class="form-select" th:field="*{reportingManagerId}">
                                <option value="">None</option>
                                <option th:each="m : ${managers}" th:value="${m.id}" th:text="${m.fullName} + ' (' + ${m.employeeCode} + ')'" th:if="${m.id != employeeDto.id}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Salary (Annual ₹)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{salary}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Status <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{status}" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''" required>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" onclick="showStep(1)"><i class="bi bi-arrow-left me-2"></i> Previous</button>
                        <button type="button" class="btn btn-primary rounded-pill px-4" onclick="showStep(3)">Next Step <i class="bi bi-arrow-right ms-2"></i></button>
                    </div>
                </div>
                
                <!-- STEP 3 -->
                <div class="step-pane" id="step3">
                    <h5 class="fw-bold mb-4">Shift & Review</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Assigned Shift</label>
                            <select class="form-select" th:field="*{shiftId}">
                                <option value="">Select Shift</option>
                                <option th:each="s : ${shifts}" th:value="${s.id}" th:text="${s.name} + ' (' + ${s.startTime} + ' - ' + ${s.endTime} + ')'"></option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="alert alert-info mt-4">
                        <i class="bi bi-info-circle-fill me-2"></i> Please review all information before submitting. Any validation errors will be highlighted when you click Save.
                    </div>
                    
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" onclick="showStep(2)"><i class="bi bi-arrow-left me-2"></i> Previous</button>
                        <button type="submit" class="btn btn-success rounded-pill px-5 fw-bold"><i class="bi bi-check-lg me-2"></i>Save Employee</button>
                    </div>
                </div>
                
            </form>
        </div>
    </div>
    
    <th:block layout:fragment="scripts">
        <script>
            function showStep(stepNum) {
                // hide all
                document.querySelectorAll('.step-pane').forEach(el => el.classList.remove('active'));
                document.querySelectorAll('#stepper .nav-link').forEach(el => el.classList.remove('active'));
                
                // show target
                document.getElementById('step' + stepNum).classList.add('active');
                document.getElementById('btn-step' + stepNum).classList.add('active');
            }

            // If there are validation errors on load, show step 1 by default (or check where errors are)
            document.addEventListener('DOMContentLoaded', () => {
                if(document.querySelector('.is-invalid')) {
                    const invalidField = document.querySelector('.is-invalid');
                    const pane = invalidField.closest('.step-pane');
                    if(pane) {
                        const stepId = pane.id; // step1, step2, step3
                        const stepNum = stepId.replace('step', '');
                        showStep(stepNum);
                    }
                }
            });
        </script>
    </th:block>
</body>
</html>
